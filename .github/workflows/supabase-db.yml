name: Supabase DB

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-db.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-db.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure migration files exist
        run: test -n "$(find supabase/migrations -type f -name '*.sql' -print -quit)"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lint local schema
        run: supabase db lint --config supabase/config.toml

      - name: Dry-run migration generation check
        run: supabase db diff --config supabase/config.toml --schema public || true

  deploy:
    if: github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_ID != ''
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase db push --project-ref "$SUPABASE_PROJECT_ID"
